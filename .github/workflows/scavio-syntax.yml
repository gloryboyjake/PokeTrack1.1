name: Scavio branch syntax check
on:
  push:
    branches:
      - feature/scavio-inventory-integration
    paths:
      - app.py
      - .github/workflows/scavio-syntax.yml
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application
        run: python -m py_compile app.py
