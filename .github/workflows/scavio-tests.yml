name: Scavio branch tests
on:
  push:
    branches:
      - feature/scavio-inventory-integration
    paths:
      - app.py
      - tests/**
      - requirements.txt
      - .github/workflows/scavio-tests.yml
  workflow_dispatch:
jobs:
  mocked-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: pip install -r requirements.txt
      - name: Compile application and tests
        run: python -m py_compile app.py tests/test_scavio.py
      - name: Run mocked Scavio integration tests
        run: python -m unittest discover -s tests -v
