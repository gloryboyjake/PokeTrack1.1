name: PokeTrack live verification
on:
  push:
    branches: [rebuild/clean-start]
jobs:
  verify-live-scans:
    if: contains(github.event.head_commit.message, '[poke-live-test]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check live API
        run: |
          set -e
          curl -fsS https://poketrack-api-production.up.railway.app/health
          echo
      - name: Run retailer product scan
        run: |
          set -e
          curl -fsS -X POST 'https://poketrack-api-production.up.railway.app/api/scan?kind=products'
          echo
          for i in $(seq 1 120); do
            DATA=$(curl -fsS https://poketrack-api-production.up.railway.app/api/history)
            echo "$DATA" > /tmp/history.json
            STATUS=$(python -c 'import json; d=json.load(open("/tmp/history.json")); print(d["runs"][0]["status"] if d.get("runs") else "missing")')
            if [ "$STATUS" = completed ] || [ "$STATUS" = error ]; then
              echo "$DATA"
              break
            fi
            sleep 10
          done
      - name: Run Google-only branch inventory scan
        run: |
          set -e
          curl -fsS -X POST 'https://poketrack-api-production.up.railway.app/api/scan?kind=inventory'
          echo
          for i in $(seq 1 120); do
            DATA=$(curl -fsS https://poketrack-api-production.up.railway.app/api/history)
            echo "$DATA" > /tmp/history.json
            STATUS=$(python -c 'import json; d=json.load(open("/tmp/history.json")); print(d["runs"][0]["status"] if d.get("runs") else "missing")')
            if [ "$STATUS" = completed ] || [ "$STATUS" = error ]; then
              echo "$DATA"
              break
            fi
            sleep 10
          done
