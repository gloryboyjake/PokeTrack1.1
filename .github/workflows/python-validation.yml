name: Python validation

on:
  pull_request:
    branches: [rebuild/clean-start]
  push:
    branches: [fix/retailer-product-discovery]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app test dependencies
        run: python -m pip install --disable-pip-version-check Flask requests beautifulsoup4
      - name: Compile Python files
        run: python -m compileall -q app.py
      - name: Test monitoring schema and product request API
        env:
          DB_PATH: /tmp/poketrack-validation.db
        run: |
          python - <<'PY'
          import app
          c = app.conn()
          tables = {r[0] for r in c.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert {'product_catalog', 'product_stock_history', 'restock_events', 'product_requests'} <= tables
          columns = {r[1] for r in c.execute('PRAGMA table_info(products)')}
          assert {'monitor_enabled', 'check_interval_seconds', 'next_check_at', 'last_status_change'} <= columns
          c.close()
          result = app.monitor_due_products()
          assert result['checked'] == 0
          client = app.app.test_client()
          response = client.post('/api/product-requests', json={'product_title': 'Pokémon 30th Celebration ETB', 'retailer': 'Target'})
          assert response.status_code == 201, response.get_json()
          request_id = response.get_json()['request_id']
          listed = client.get('/api/product-requests').get_json()['requests']
          assert any(x['id'] == request_id for x in listed)
          assert client.get('/api/restock-events').status_code == 200
          c = app.conn()
          c.execute("INSERT INTO product_catalog(title,normalized_title,created_at,updated_at) VALUES(?,?,?,?)", ('Test ETB', 'test etb', app.now(), app.now()))
          catalog_id = c.execute("SELECT id FROM product_catalog WHERE normalized_title='test etb'").fetchone()[0]
          c.commit()
          c.close()
          assert client.get('/api/catalog').status_code == 200
          paused = client.post(f'/api/catalog/{catalog_id}/track', json={'enabled': False})
          assert paused.status_code == 200 and paused.get_json()['track_all'] is False
          resumed = client.post(f'/api/catalog/{catalog_id}/track', json={'enabled': True})
          assert resumed.status_code == 200 and resumed.get_json()['track_all'] is True
          print('Monitoring schema, request queue, grouped catalog, Track All controls, and restock endpoint passed')
          PY
