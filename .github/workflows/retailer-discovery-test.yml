name: Retailer product discovery test

on:
  push:
    branches: [fix/retailer-product-discovery]
  workflow_dispatch:

# Retailer sites rate-limit repeated requests. Keep one live scan at a time.
concurrency:
  group: retailer-discovery-live
  cancel-in-progress: true

jobs:
  live-product-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PATH: /tmp/poketrack-live-test.db
      LOG_LEVEL: INFO
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scanner dependencies
        run: python -m pip install --disable-pip-version-check Flask requests beautifulsoup4 curl_cffi
      - name: Validate Python syntax
        run: python -m py_compile app.py
      - name: Run full live retailer discovery
        run: |
          python - <<'PY'
          import app
          import json
          import sys
          assert app.is_pokemon_tcg_title("Pokémon Mega Evolution Phantasmal Flames Elite Trainer Box")
          assert app.is_pokemon_tcg_title("Pokémon Scarlet & Violet Booster Bundle")
          assert not app.is_pokemon_tcg_title("Pokémon Classic Story Collection Box Set, Paperback")
          assert not app.is_pokemon_tcg_title("Pokémon plush figure")
          print("TCG title-filter checks passed", flush=True)
          results = []
          failures = []
          for retailer in app.RETAILERS:
              print(f"\\n===== {retailer} =====", flush=True)
              try:
                  products = app.search_products(retailer)
                  results.append({
                      "retailer": retailer,
                      "discovered_listings": len(products),
                      "first_party_verified": sum(1 for p in products if p.get("seller_verified")),
                      "unverified_or_blocked": sum(1 for p in products if not p.get("seller_verified")),
                      "products": [
                          {
                              "title": p["title"],
                              "url": p["url"],
                              "seller": p["seller"],
                              "seller_verified": p.get("seller_verified", False),
                              "availability": p["availability"]
                          }
                          for p in products
                      ]
                  })
                  print(f"RESULT {retailer}: {len(products)} discovered; {sum(1 for p in products if p.get('seller_verified'))} first-party verified; {sum(1 for p in products if not p.get('seller_verified'))} unverified/blocked", flush=True)
              except Exception as exc:
                  failures.append({"retailer": retailer, "error": str(exc)})
                  print(f"ERROR {retailer}: {exc}", flush=True)
          print("\\n===== SUMMARY =====")
          print(json.dumps({"results": results, "failures": failures}, indent=2))
          with open("/tmp/poketrack-discovery-results.json", "w") as f:
              json.dump({"results": results, "failures": failures}, f, indent=2)
          if failures or not any(r["discovered_listings"] for r in results):
              sys.exit(1)
          PY
